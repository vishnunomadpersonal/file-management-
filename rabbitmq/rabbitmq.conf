# RabbitMQ Configuration
# Advanced settings for file management system

# =============================================================================
# GENERAL SETTINGS
# =============================================================================

# Logging
log.file.level = info
log.console = true
log.console.level = info

# Management plugin
management.tcp.port = 15672
management.load_definitions = /etc/rabbitmq/definitions.json

# =============================================================================
# MEMORY & DISK SETTINGS
# =============================================================================

# Memory high watermark (40% of available RAM)
vm_memory_high_watermark.relative = 0.4

# Disk free limit (minimum 1GB free)
disk_free_limit.absolute = 1GB

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================

# Heartbeat interval (seconds)
heartbeat = 60

# Max message size (256MB for large files)
max_message_size = 268435456

# Channel max (per connection)
channel_max = 128

# =============================================================================
# QUEUE SETTINGS
# =============================================================================

# Default queue durability
queue_master_locator = min-masters

# Consumer timeout (30 minutes for long-running tasks)
consumer_timeout = 1800000

# =============================================================================
# PERSISTENCE SETTINGS
# =============================================================================

# Message persistence
queue_index_embed_msgs_below = 4096

# Lazy queues (write to disk immediately - better for large queues)
# Queues can be configured as lazy individually

# =============================================================================
# PLUGIN SETTINGS
# =============================================================================

# Shovel plugin (for moving messages between queues)
# Useful for retry mechanisms
